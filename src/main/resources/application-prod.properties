# Server
server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}

# Logging
logging.level.root=INFO
logging.level.com.gourav.jobqueuebackend=INFO
management.endpoint.health.show-details=never

# Job Worker Configuration
jobforge.worker.enabled=${JOB_WORKER_ENABLED}
jobforge.worker.concurrency=${JOB_WORKER_CONCURRENCY}
jobforge.worker.poll-interval-ms=${JOB_WORKER_POLL_INTERVAL_MS}
jobforge.worker.shutdown-wait-seconds=${JOB_WORKER_SHUTDOWN_WAIT_SECONDS}
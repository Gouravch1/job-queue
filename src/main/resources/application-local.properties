# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Logging
logging.level.root=INFO
logging.level.com.gourav.jobqueuebackend=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
management.endpoint.health.show-details=always

# Job Worker Configuration
jobforge.worker.enabled=true
jobforge.worker.concurrency=4
jobforge.worker.poll-interval-ms=1000
jobforge.worker.shutdown-wait-seconds=30

# Retry Engine
jobforge.retry.base-delay-ms=5000
jobforge.retry.max-delay-ms=300000


spring.application.name=jobqueue-backend

# Default profile
spring.profiles.default=local

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JSON and date handling
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Actuator
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

# Application Information
info.app.name=JobForge
info.app.description=Reliable Job Processing Platform
info.app.version=0.1.0